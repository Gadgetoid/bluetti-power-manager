name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.13"
  FONTS_VERSION: "1.0.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: source ci/python.sh && qa_prepare_all

      - name: Lint the app
        run: source ci/python.sh && qa_check

  build:
    name: Build the app
    runs-on: ubuntu-24.04
    needs: [lint]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache the source fonts
        uses: actions/cache@v6
        with:
          path: build/sources
          key: sources-${{ hashFiles('fonts.toml', 'corpus/*.txt') }}
          restore-keys: sources-

      - name: Build the fonts
        run: |
          uvx badgeware-fonts@${{ env.FONTS_VERSION }} --manifest fonts.toml \
              build coda-symbols dseg7-classic --loose --out bluetti_powman/fonts

      - name: Check the app is complete
        run: |
          for f in __init__.py bluetti.py secp256r1.mpy ui.py icon.png \
                   fonts/coda-symbols.af fonts/dseg7-classic.af \
                   fonts/CODA-OFL.txt fonts/DSEG-LICENSE.txt; do
            test -s "bluetti_powman/$f" || { echo "::error::missing bluetti_powman/$f"; exit 1; }
          done

      - name: Pack the app
        run: |
          mkdir -p dist
          zip -r -X dist/bluetti_powman.zip bluetti_powman \
              -x '*/__pycache__/*' '*/.DS_Store'
          unzip -l dist/bluetti_powman.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: bluetti_powman
          path: dist/bluetti_powman.zip
          compression-level: 0

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/bluetti_powman.zip
